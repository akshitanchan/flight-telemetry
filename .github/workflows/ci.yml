# ===========================================================
# Flight Telemetry Platform — CI
# ===========================================================
# Runs the per-layer test suites, the documentation link check, and the
# offline cross-layer smoke test. The Ollama LLM strategy is not available in
# CI, so the AI smoke uses only the deterministic/offline path.
#
# build-images runs after the test job and verifies that all three service
# Dockerfiles produce valid images (no registry push — build only).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directories
        run: make setup

      - name: Contracts
        run: make test-contracts

      - name: Systems tests
        run: make test-systems

      - name: Data tests
        run: make test-data

      - name: AI tests
        run: make test-ai

      - name: AI eval replay
        run: make eval DRY_RUN=1

      - name: AI eval is reproducible
        run: git diff --exit-code ai/eval/results.md ai/eval/results.json

      - name: Cloud tests
        run: make test-cloud

      - name: Dashboard tests
        run: make test-dashboard

      - name: Cross-layer smoke (offline)
        run: make smoke

  # ---------------------------------------------------------------------------
  # ML test suite (~157 s).  Runs in parallel with the main test job so it
  # gates every PR without adding to the fast-feedback wall-clock time.
  # Setup mirrors the test job exactly; no live-service env vars are set —
  # the suite skips registry/validate paths that require external services.
  # ---------------------------------------------------------------------------
  ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directories
        run: make setup

      - name: ML tests
        run: make test-ml

  # ---------------------------------------------------------------------------
  # Build the three service images.
  # No image is pushed to any registry — this job only validates that every
  # Dockerfile produces a successful build from the repo-root build context.
  # Runs only after both test jobs pass.
  # ---------------------------------------------------------------------------
  build-images:
    runs-on: ubuntu-latest
    needs: [test, ml-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Build ml-serve image
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: infra/docker/ml-serve.Dockerfile
          push: false
          tags: flight-telemetry/ml-serve:ci

      - name: Build ingestion image
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: infra/docker/ingestion.Dockerfile
          push: false
          tags: flight-telemetry/ingestion:ci

      - name: Build dashboard image
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: infra/docker/dashboard.Dockerfile
          push: false
          tags: flight-telemetry/dashboard:ci
