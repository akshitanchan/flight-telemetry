# ===========================================================
# Flight Telemetry Platform — CI
# ===========================================================
# Runs the per-layer test suites, the documentation link check, and the
# offline cross-layer smoke test. The Ollama LLM strategy is not available in
# CI, so the AI smoke uses only the deterministic/offline path.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directories
        run: make setup

      - name: Contracts
        run: make test-contracts

      - name: Systems tests
        run: make test-systems

      - name: Data tests
        run: make test-data

      - name: AI tests
        run: make test-ai

      - name: Docs check
        run: make docs-check

      - name: Cross-layer smoke (offline)
        run: make smoke
