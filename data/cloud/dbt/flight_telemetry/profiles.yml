# dbt profile for flight_telemetry. every value comes from env_var(), so this
# file is safe to commit; nothing here is a real credential.
#
# bigquery env vars: BIGQUERY_PROJECT, GOOGLE_APPLICATION_CREDENTIALS
# snowflake env vars: SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PRIVATE_KEY_PATH,
#   SNOWFLAKE_ROLE, SNOWFLAKE_WAREHOUSE, SNOWFLAKE_DATABASE, SNOWFLAKE_SCHEMA
#
# terraform (infra/terraform/bigquery) already provisions the bigquery side:
#   - dataset: flight_telemetry (US, multi-region)
#   - service account: dbt-runner  (roles/bigquery.dataEditor + bigquery.jobUser)

flight_telemetry:
  target: prod

  outputs:
    prod: &bigquery
      type: bigquery
      method: service-account
      project: "{{ env_var('BIGQUERY_PROJECT') }}"
      dataset: flight_telemetry
      location: US
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      threads: 4
      timeout_seconds: 300
      priority: interactive
      # Retries on transient BigQuery errors (rate limits, backend errors)
      retries: 3

    # alias so the warehouse-named target (paired with snowflake below) works.
    bigquery: *bigquery

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      threads: 4

    # Offline / CI profile — for dbt parse and dbt ls without real credentials.
    # Note: dbt compile and dbt test (data tests) still require a live BigQuery
    # connection because the BigQuery adapter populates a relation cache on startup.
    # Set --target offline to activate.
    offline:
      type: bigquery
      method: service-account
      project: "{{ env_var('BIGQUERY_PROJECT', 'dummy-project') }}"
      dataset: flight_telemetry
      location: US
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '/dev/null') }}"
      threads: 1
      timeout_seconds: 60

    # in-memory duckdb target so the native unit tests run with no credentials.
    # usage: dbt test --select "test_type:unit" --target duckdb_unit
    duckdb_unit:
      type: duckdb
      path: ":memory:"
      threads: 1
