version: 2

# dbt >= 1.8 native unit tests. fixtures use format: sql so dbt does not need
# to introspect the destination relation for column types (offline-safe).
#
# unit tests run on whatever adapter the target uses, not always duckdb, so
# fixtures use bare literals and typed timestamp literals ("timestamp '...'")
# that parse the same way on duckdb, bigquery, and snowflake.
#
# every unit test on an incremental model must declare:
#   overrides:
#     macros:
#       is_incremental: true   # or false for full-refresh simulation
#
# run: dbt test --select "test_type:unit" --target duckdb_unit

unit_tests:

  # =========================================================================
  # gold_airport_congestion — incremental snapshot includes corrected keys
  # =========================================================================
  - name: ut_airport_congestion_incremental_snapshot
    description: >
      Verifies that incremental compilation keeps the full replacement landing
      snapshot, including rows at existing timestamps that may be corrections.
    model: gold_airport_congestion
    overrides:
      macros:
        is_incremental: true

    given:
      - input: source('gold_landing', 'gold_airport_congestion_landing')
        format: sql
        rows: |
          select
            'EGLL' AS airport_icao,
            timestamp '2024-01-15 09:55:00' AS window_start,
            timestamp '2024-01-15 10:00:00' AS window_end,
            12 AS aircraft_count,
            850.5 AS avg_altitude_m,
            3 AS ground_count,
            9 AS airborne_count
          UNION ALL
          select
            'EGLL',
            timestamp '2024-01-15 10:00:00',
            timestamp '2024-01-15 10:05:00',
            14,
            NULL,
            5,
            9
          UNION ALL
          select
            'EGLL',
            timestamp '2024-01-15 10:05:00',
            timestamp '2024-01-15 10:10:00',
            11,
            920.0,
            2,
            9
          UNION ALL
          select
            'EDDM',
            timestamp '2024-01-15 10:10:00',
            timestamp '2024-01-15 10:15:00',
            7,
            600.0,
            1,
            6

    expect:
      format: sql
      rows: |
        select
          'EGLL' AS airport_icao,
          timestamp '2024-01-15 09:55:00' AS window_start,
          timestamp '2024-01-15 10:00:00' AS window_end,
          12 AS aircraft_count,
          850.5 AS avg_altitude_m,
          3 AS ground_count,
          9 AS airborne_count
        UNION ALL
        select
          'EGLL',
          timestamp '2024-01-15 10:00:00',
          timestamp '2024-01-15 10:05:00',
          14,
          NULL,
          5,
          9
        UNION ALL
        select
          'EGLL' AS airport_icao,
          timestamp '2024-01-15 10:05:00' AS window_start,
          timestamp '2024-01-15 10:10:00' AS window_end,
          11 AS aircraft_count,
          920.0 AS avg_altitude_m,
          2 AS ground_count,
          9 AS airborne_count
        UNION ALL
        select
          'EDDM',
          timestamp '2024-01-15 10:10:00',
          timestamp '2024-01-15 10:15:00',
          7,
          600.0,
          1,
          6

  # =========================================================================
  # gold_airport_congestion — full-refresh (is_incremental = false)
  # =========================================================================
  - name: ut_airport_congestion_full_refresh
    description: >
      Verifies that on a full-refresh run (is_incremental = false) all
      source rows pass through without any filtering, including rows with
      nullable avg_altitude_m.
    model: gold_airport_congestion
    overrides:
      macros:
        is_incremental: false

    given:
      - input: source('gold_landing', 'gold_airport_congestion_landing')
        format: sql
        rows: |
          select
            'KLAX' AS airport_icao,
            timestamp '2024-03-01 08:00:00' AS window_start,
            timestamp '2024-03-01 08:05:00' AS window_end,
            30 AS aircraft_count,
            NULL AS avg_altitude_m,
            10 AS ground_count,
            20 AS airborne_count
          UNION ALL
          select
            'KLAX',
            timestamp '2024-03-01 08:05:00',
            timestamp '2024-03-01 08:10:00',
            28,
            1100.0,
            8,
            20

    expect:
      format: sql
      rows: |
        select
          'KLAX' AS airport_icao,
          timestamp '2024-03-01 08:00:00' AS window_start,
          timestamp '2024-03-01 08:05:00' AS window_end,
          30 AS aircraft_count,
          NULL AS avg_altitude_m,
          10 AS ground_count,
          20 AS airborne_count
        UNION ALL
        select
          'KLAX',
          timestamp '2024-03-01 08:05:00',
          timestamp '2024-03-01 08:10:00',
          28,
          1100.0,
          8,
          20

  # =========================================================================
  # gold_sector_load — incremental snapshot
  # =========================================================================
  - name: ut_sector_load_incremental_snapshot
    description: >
      Verifies that incremental compilation keeps every row in the replacement
      landing snapshot.
    model: gold_sector_load
    overrides:
      macros:
        is_incremental: true

    given:
      - input: source('gold_landing', 'gold_sector_load_landing')
        format: sql
        rows: |
          select
            '8426b47ffffffff' AS h3_r4,
            timestamp '2024-01-20 12:00:00' AS window_start,
            timestamp '2024-01-20 12:05:00' AS window_end,
            4 AS aircraft_count
          UNION ALL
          select
            '8426b47ffffffff',
            timestamp '2024-01-20 12:05:00',
            timestamp '2024-01-20 12:10:00',
            6
          UNION ALL
          select
            '8426b4fffffffff',
            timestamp '2024-01-20 12:10:00',
            timestamp '2024-01-20 12:15:00',
            2

    expect:
      format: sql
      rows: |
        select
          '8426b47ffffffff' AS h3_r4,
          timestamp '2024-01-20 12:00:00' AS window_start,
          timestamp '2024-01-20 12:05:00' AS window_end,
          4 AS aircraft_count
        UNION ALL
        select
          '8426b47ffffffff' AS h3_r4,
          timestamp '2024-01-20 12:05:00' AS window_start,
          timestamp '2024-01-20 12:10:00' AS window_end,
          6 AS aircraft_count
        UNION ALL
        select
          '8426b4fffffffff',
          timestamp '2024-01-20 12:10:00',
          timestamp '2024-01-20 12:15:00',
          2

  # =========================================================================
  # gold_emergency_events — incremental snapshot + squawk pass-through
  # =========================================================================
  - name: ut_emergency_events_incremental_snapshot
    description: >
      Verifies all replacement-snapshot rows and all three valid squawk codes
      pass through, including nullable callsign and nearest_airport.
    model: gold_emergency_events
    overrides:
      macros:
        is_incremental: true

    given:
      - input: source('gold_landing', 'gold_emergency_events_landing')
        format: sql
        rows: |
          select
            'a1b2c3' AS icao24,
            'BAW123' AS callsign,
            '7700' AS squawk,
            timestamp '2024-02-10 14:30:00' AS first_seen_ts,
            timestamp '2024-02-10 14:45:00' AS last_seen_ts,
            51.5 AS lat,
            -0.1 AS lon,
            'United Kingdom' AS origin_country,
            'EGLL' AS nearest_airport,
            900 AS duration_s
          UNION ALL
          select
            'd4e5f6',
            NULL,
            '7500',
            timestamp '2024-02-10 15:00:00',
            timestamp '2024-02-10 15:10:00',
            48.9,
            2.3,
            'France',
            NULL,
            600
          UNION ALL
          select
            'aabbcc',
            'DLH456',
            '7600',
            timestamp '2024-02-10 15:20:00',
            timestamp '2024-02-10 15:25:00',
            52.3,
            13.4,
            'Germany',
            'EDDB',
            300

    expect:
      format: sql
      rows: |
        select
          'a1b2c3' AS icao24,
          'BAW123' AS callsign,
          '7700' AS squawk,
          timestamp '2024-02-10 14:30:00' AS first_seen_ts,
          timestamp '2024-02-10 14:45:00' AS last_seen_ts,
          51.5 AS lat,
          -0.1 AS lon,
          'United Kingdom' AS origin_country,
          'EGLL' AS nearest_airport,
          900 AS duration_s
        UNION ALL
        select
          'd4e5f6' AS icao24,
          NULL AS callsign,
          '7500' AS squawk,
          timestamp '2024-02-10 15:00:00' AS first_seen_ts,
          timestamp '2024-02-10 15:10:00' AS last_seen_ts,
          48.9 AS lat,
          2.3 AS lon,
          'France' AS origin_country,
          NULL AS nearest_airport,
          600 AS duration_s
        UNION ALL
        select
          'aabbcc',
          'DLH456',
          '7600',
          timestamp '2024-02-10 15:20:00',
          timestamp '2024-02-10 15:25:00',
          52.3,
          13.4,
          'Germany',
          'EDDB',
          300

  # =========================================================================
  # gold_routing_stats — incremental snapshot + nullable columns
  # =========================================================================
  - name: ut_routing_stats_incremental_snapshot
    description: >
      Verifies the replacement snapshot passes through on incremental runs.
      Also covers nullable max_altitude_m and avg_velocity_mps.
    model: gold_routing_stats
    overrides:
      macros:
        is_incremental: true

    given:
      - input: source('gold_landing', 'gold_routing_stats_landing')
        format: sql
        rows: |
          select
            '112233' AS icao24,
            'EZY001' AS callsign,
            timestamp '2024-03-05 06:00:00' AS window_start,
            timestamp '2024-03-05 06:30:00' AS window_end,
            51.1 AS origin_lat,
            -1.8 AS origin_lon,
            51.5 AS destination_lat,
            -0.1 AS destination_lon,
            10000.0 AS max_altitude_m,
            220.5 AS avg_velocity_mps,
            180 AS ping_count
          UNION ALL
          select
            '445566',
            NULL,
            timestamp '2024-03-05 07:00:00',
            timestamp '2024-03-05 07:45:00',
            48.4,
            11.8,
            50.0,
            8.6,
            NULL,
            NULL,
            12
          UNION ALL
          select
            '778899',
            'RYR202',
            timestamp '2024-03-05 08:00:00',
            timestamp '2024-03-05 08:55:00',
            53.4,
            -6.3,
            40.5,
            -3.6,
            11200.0,
            245.0,
            324

    expect:
      format: sql
      rows: |
        select
          '112233' AS icao24,
          'EZY001' AS callsign,
          timestamp '2024-03-05 06:00:00' AS window_start,
          timestamp '2024-03-05 06:30:00' AS window_end,
          51.1 AS origin_lat,
          -1.8 AS origin_lon,
          51.5 AS destination_lat,
          -0.1 AS destination_lon,
          10000.0 AS max_altitude_m,
          220.5 AS avg_velocity_mps,
          180 AS ping_count
        UNION ALL
        select
          '445566' AS icao24,
          NULL AS callsign,
          timestamp '2024-03-05 07:00:00' AS window_start,
          timestamp '2024-03-05 07:45:00' AS window_end,
          48.4 AS origin_lat,
          11.8 AS origin_lon,
          50.0 AS destination_lat,
          8.6 AS destination_lon,
          NULL AS max_altitude_m,
          NULL AS avg_velocity_mps,
          12 AS ping_count
        UNION ALL
        select
          '778899',
          'RYR202',
          timestamp '2024-03-05 08:00:00',
          timestamp '2024-03-05 08:55:00',
          53.4,
          -6.3,
          40.5,
          -3.6,
          11200.0,
          245.0,
          324
